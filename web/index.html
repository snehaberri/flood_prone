<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bengaluru flood-risk routing</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --bg:#12161c; --panel:#1a2029; --line:#2b3440; --ink:#e6eaf0; --dim:#8b97a8;
    --accent:#4ea1ff; --safe:#2ecc8f; --fast:#ffb020;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;
    background:var(--bg);color:var(--ink)}
  #app{display:flex;height:100%}
  #panel{width:340px;flex:0 0 340px;background:var(--panel);border-right:1px solid var(--line);
    overflow-y:auto;padding:18px}
  #map{flex:1}
  h1{font-size:17px;margin:0 0 2px}
  .sub{color:var(--dim);font-size:12px;margin-bottom:16px}
  section{border-top:1px solid var(--line);padding:14px 0}
  section:first-of-type{border-top:0;padding-top:0}
  h2{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin:0 0 10px}
  button{width:100%;padding:9px;border:0;border-radius:6px;background:var(--accent);color:#08101c;
    font-weight:650;font-size:13px;cursor:pointer;font-family:inherit}
  button:disabled{opacity:.4;cursor:default}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--dim);font-weight:500;margin-top:7px}
  input[type=range]{width:100%;accent-color:var(--accent)}
  select{width:100%;padding:7px;background:#111720;color:var(--ink);border:1px solid var(--line);
    border-radius:6px;font-family:inherit;font-size:13px}
  .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:5px 0}
  .row b{font-variant-numeric:tabular-nums;font-weight:600}
  .pt{display:flex;gap:8px;align-items:center;margin:6px 0;font-size:13px}
  .dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px}
  .muted{color:var(--dim)}
  .card{background:#141a22;border:1px solid var(--line);border-radius:7px;padding:10px;margin-bottom:8px}
  .card h3{margin:0 0 7px;font-size:13px;display:flex;align-items:center;gap:7px}
  .bar{height:5px;border-radius:3px;background:#222c38;overflow:hidden;margin-top:3px}
  .bar > i{display:block;height:100%}
  .note{font-size:11.5px;color:var(--dim);line-height:1.55;background:#141a22;
    border-left:2px solid #3a4756;padding:9px 11px;border-radius:0 5px 5px 0}
  .legend{display:flex;gap:3px;margin-top:8px}
  .legend div{flex:1;height:7px}
  .legend-lab{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);margin-top:3px}
  .warn{color:#ffb020;font-size:12px;margin-top:6px}
  .err{color:#ff6b6b;font-size:12.5px}
</style>
</head>
<body>
<div id="app">
  <div id="panel">
    <h1>Bengaluru flood-risk routing</h1>
    <div class="sub">Terrain-derived susceptibility &times; live rainfall</div>

    <section>
      <h2>Route</h2>
      <div class="pt"><span class="dot" style="background:var(--safe)"></span>
        <span id="o-lab" class="muted">click the map to set origin</span></div>
      <div class="pt"><span class="dot" style="background:#ff6b6b"></span>
        <span id="d-lab" class="muted">then click again for destination</span></div>
      <button id="go" disabled>Find routes</button>
      <button class="ghost" id="clear">Clear</button>
      <div id="route-out"></div>
    </section>

    <section>
      <h2>Rainfall</h2>
      <select id="rain-mode">
        <option value="forecast">Use forecast hour</option>
        <option value="manual">Set manually</option>
      </select>
      <div id="fc-wrap" style="margin-top:9px">
        <input type="range" id="hour" min="0" max="0" value="0">
        <div class="row"><span class="muted" id="hour-lab">-</span>
          <b id="trig-lab">-</b></div>
      </div>
      <div id="man-wrap" style="display:none;margin-top:9px">
        <input type="range" id="trigger" min="0" max="100" value="60">
        <div class="row"><span class="muted">Rain intensity</span><b id="man-lab">0.60</b></div>
      </div>
    </section>

    <section>
      <h2>Risk layer</h2>
      <input type="range" id="thresh" min="40" max="95" value="75">
      <div class="row"><span class="muted">Show roads above</span><b id="thresh-lab">0.75</b></div>
      <button class="ghost" id="toggle-risk">Show risk layer</button>
      <div class="legend">
        <div style="background:#3a6"></div><div style="background:#9c3"></div>
        <div style="background:#fc0"></div><div style="background:#f83"></div>
        <div style="background:#d22"></div>
      </div>
      <div class="legend-lab"><span>lower</span><span>susceptibility</span><span>higher</span></div>
    </section>

    <section>
      <h2>What this is</h2>
      <div class="note" id="meta-note">loading model metadata&hellip;</div>
    </section>
  </div>
  <div id="map"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $ = id => document.getElementById(id);
// preferCanvas: the risk layer is ~20k polylines; SVG rendering stalls the
// page at that count, canvas handles it comfortably.
const map = L.map('map', {zoomControl:true, preferCanvas:true})
  .setView([12.9716,77.5946], 12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom:19, attribution:'&copy; OpenStreetMap contributors'
}).addTo(map);

let origin=null, dest=null, markers=[], routeLayer=null, riskLayer=null, rain=null;

function riskColor(s){
  return s>=.8?'#d22' : s>=.65?'#f83' : s>=.5?'#fc0' : s>=.35?'#9c3' : '#3a6';
}
function fmtKm(m){ return (m/1000).toFixed(2)+' km'; }
function fmtMin(s){ return (s/60).toFixed(0)+' min'; }

/* ---------- rainfall ---------- */
fetch('/api/rainfall').then(r=>r.json()).then(d=>{
  rain = d;
  const h=$('hour');
  h.max = d.times.length-1;
  // Default to the current hour: past_days=3 means index 72 is roughly now.
  const now = new Date();
  let best=0, bestDiff=Infinity;
  d.times.forEach((t,i)=>{ const diff=Math.abs(new Date(t+'+05:30')-now);
    if(diff<bestDiff){bestDiff=diff;best=i;} });
  h.value=best; updateHour();
}).catch(()=>{ $('hour-lab').textContent='rainfall unavailable'; });

function updateHour(){
  if(!rain) return;
  const i=+$('hour').value;
  $('hour-lab').textContent = rain.times[i].replace('T',' ');
  $('trig-lab').textContent = 'trigger '+rain.city_trigger[i].toFixed(2);
}
function currentTrigger(){
  if($('rain-mode').value==='manual') return +$('trigger').value/100;
  return rain ? rain.city_trigger[+$('hour').value] : 0;
}
$('hour').oninput = updateHour;
$('trigger').oninput = ()=> $('man-lab').textContent=(+$('trigger').value/100).toFixed(2);
$('rain-mode').onchange = e=>{
  const man = e.target.value==='manual';
  $('man-wrap').style.display = man?'block':'none';
  $('fc-wrap').style.display  = man?'none':'block';
};

// ---------- reverse geocoding ----------
async function getPlaceName(lat, lon) {
  try {
    const res = await fetch(
      `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}`
    );

    if (!res.ok) throw new Error('Geocoding failed');

    const data = await res.json();

    // Try to get a useful human-readable place name
    const a = data.address || {};

    return (
      a.road ||
      a.neighbourhood ||
      a.suburb ||
      a.city_district ||
      a.city ||
      data.display_name ||
      `${lat.toFixed(4)}, ${lon.toFixed(4)}`
    );
  } catch (err) {
    console.error('Reverse geocoding error:', err);
    return `${lat.toFixed(4)}, ${lon.toFixed(4)}`;
  }
}

/* ---------- picking points ---------- */
map.on('click', async e => {
  const ll = [e.latlng.lat, e.latlng.lng];

  if (!origin) {
    origin = ll;

    addMarker(ll, 'var(--safe)');

    $('o-lab').textContent = 'Finding location…';
    $('o-lab').classList.remove('muted');

    const place = await getPlaceName(ll[0], ll[1]);
    $('o-lab').textContent = place;

  } else if (!dest) {
    dest = ll;

    addMarker(ll, '#ff6b6b');

    $('d-lab').textContent = 'Finding location…';
    $('d-lab').classList.remove('muted');

    const place = await getPlaceName(ll[0], ll[1]);
    $('d-lab').textContent = place;
  }

  $('go').disabled = !(origin && dest);
});

function addMarker(ll,color){
  markers.push(L.circleMarker(ll,{radius:7,color:'#fff',weight:2,fillColor:color,fillOpacity:1}).addTo(map));
}
$('clear').onclick = ()=>{
  origin=dest=null; markers.forEach(m=>map.removeLayer(m)); markers=[];
  if(routeLayer){ map.removeLayer(routeLayer); routeLayer=null; }
  $('o-lab').textContent='click the map to set origin'; $('o-lab').classList.add('muted');
  $('d-lab').textContent='then click again for destination'; $('d-lab').classList.add('muted');
  $('route-out').innerHTML=''; $('go').disabled=true;
};

/* ---------- routing ---------- */
$('go').onclick = async ()=>{
  $('go').disabled=true; $('go').textContent='Routing…';
  const t=currentTrigger();
  try{
    const r = await fetch(`/api/route?o=${origin}&d=${dest}&trigger=${t.toFixed(3)}`);
    const d = await r.json();
    if(d.error){ $('route-out').innerHTML=`<div class="err">${d.error}</div>`; return; }
    drawRoutes(d);
  }catch(err){
    $('route-out').innerHTML=`<div class="err">${err}</div>`;
  }finally{
    $('go').disabled=false; $('go').textContent='Find routes';
  }
};

function drawRoutes(d){
  if(routeLayer) map.removeLayer(routeLayer);
  routeLayer = L.layerGroup().addTo(map);
  const style = {fastest:{color:'#ffb020',dash:'6,7'}, safest:{color:'#2ecc8f',dash:null}};

  d.routes.forEach(rt=>{
    const s=style[rt.label];
    L.polyline(rt.geometry.map(c=>[c[1],c[0]]), {
      color:s.color, weight:rt.label==='safest'?6:4, opacity:.9, dashArray:s.dash
    }).addTo(routeLayer);
  });
  const all=d.routes.flatMap(rt=>rt.geometry.map(c=>[c[1],c[0]]));
  if(all.length) map.fitBounds(L.latLngBounds(all).pad(.15));

  let html='';
  d.routes.forEach(rt=>{
    const col = rt.label==='safest'?'var(--safe)':'var(--fast)';
    html += `<div class="card">
      <h3><span class="dot" style="background:${col}"></span>${rt.label}</h3>
      <div class="row"><span class="muted">distance</span><b>${fmtKm(rt.distance_m)}</b></div>
      <div class="row"><span class="muted">free-flow time</span><b>${fmtMin(rt.free_flow_time_s)}</b></div>
      <div class="row"><span class="muted">mean risk</span><b>${rt.mean_risk.toFixed(3)}</b></div>
      <div class="bar"><i style="width:${Math.min(100,rt.mean_risk*100)}%;background:${riskColor(rt.mean_risk)}"></i></div>
      <div class="row"><span class="muted">road at risk &ge;0.4</span><b>${fmtKm(rt.high_risk_m)}</b></div>
      ${rt.warning?`<div class="warn">${rt.warning}</div>`:''}
    </div>`;
  });
  if(d.comparison){
    const c=d.comparison;
    html += c.identical
      ? `<div class="note">Both routes are identical &mdash; at this rainfall the fastest
         path is already the driest one. Raise the rain intensity to see them diverge.</div>`
      : `<div class="note">Avoiding the water costs
         <b>${(c.extra_distance_m/1000).toFixed(2)} km</b> and
         <b>${(c.extra_time_s/60).toFixed(0)} min</b>,
         and lowers mean route risk by <b>${c.risk_avoided.toFixed(3)}</b>.
         ${d.blocked_edges.toLocaleString()} road segments are treated as impassable
         at this rainfall.</div>`;
  }
  $('route-out').innerHTML = html;
}

/* ---------- risk layer ---------- */
$('thresh').oninput = ()=> $('thresh-lab').textContent=(+$('thresh').value/100).toFixed(2);
$('toggle-risk').onclick = async ()=>{
  if(riskLayer){ map.removeLayer(riskLayer); riskLayer=null; $('toggle-risk').textContent='Show risk layer'; return; }
  $('toggle-risk').textContent='Loading…';
  const m=(+$('thresh').value/100).toFixed(2);
  const gj = await (await fetch('/api/risk?min='+m)).json();
  riskLayer = L.geoJSON(gj, {
    style: f=>({color:riskColor(f.properties.s), weight:2.5, opacity:.75}),
    onEachFeature:(f,l)=>l.bindTooltip(
      `${f.properties.name||f.properties.hw}<br>susceptibility ${f.properties.s}`)
  }).addTo(map);
  $('toggle-risk').textContent=`Hide risk layer (${gj.features.length.toLocaleString()})`;
};

/* ---------- metadata ---------- */
fetch('/api/meta').then(r=>r.json()).then(d=>{
  const v=d.validation, m=d.model;
  let s = `A <b>weighted-overlay susceptibility index</b>, not a trained classifier &mdash;
    no dated flood observations exist for Bengaluru to train on, so no accuracy is claimed.
    Weights are set a priori from the urban-pluvial literature.`;
  if(m&&m.sensitivity){
    s += ` Perturbing every weight by &plusmn;30% retains
      ${(m.sensitivity.top5pct_retained*100).toFixed(0)}% of the riskiest 5% of roads.`;
  }
  if(v){
    s += ` Against ${v.n_flood_prone} independently documented flood-prone localities
      and ${v.n_control} controls, rank AUC is <b>${v.auc_p90.toFixed(2)}</b> &mdash;
      a sanity check on a small, undated, centroid-precision set, not a performance metric.`;
  }
  $('meta-note').innerHTML = s;
}).catch(()=> $('meta-note').textContent='model metadata unavailable');
</script>
</body>
</html>
